<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="96" height="96" viewBox="0 0 96 96" shape-rendering="crispEdges">
  <defs><image id="tile" width="48" height="48" image-rendering="pixelated" xlink:href="data:image/png;base64,"/></defs>
  <use xlink:href="#tile"/>
  <use xlink:href="#tile" transform="translate(96 0) scale(-1 1)"/>
  <use xlink:href="#tile" transform="translate(0 96) scale(1 -1)"/>
