<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="128" height="128" viewBox="0 0 128 128" shape-rendering="crispEdges">
  <defs><image id="tile" width="64" height="64" image-rendering="pixelated" xlink:href="data:image/png;base64,"/></defs>
  <use xlink:href="#tile"/>
  <use xlink:href="#tile" transform="translate(128 0) scale(-1 1)"/>
  <use xlink:href="#tile" transform="translate(0 128) scale(1 -1)"/>
  <use xlink:href="#tile" transform="translate(128 128) scale(-1 -1)"/>
</svg>